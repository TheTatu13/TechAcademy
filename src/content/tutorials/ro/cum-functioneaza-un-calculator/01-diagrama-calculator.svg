<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Schemă: procesorul lucrează pe date din RAM, iar RAM se încarcă din stocare">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="800" height="300" rx="16" fill="#0f1a21"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="70" width="200" height="150" rx="14" fill="#12303a" stroke="#22d3ee" stroke-width="2"/>
    <text x="130" y="120" font-size="22" font-weight="700" fill="#e6fbff">Procesor (CPU)</text>
    <text x="130" y="150" font-size="16" fill="#9fdce8">creierul</text>
    <text x="130" y="180" font-size="14" fill="#9fdce8">face calculele</text>

    <rect x="300" y="70" width="200" height="150" rx="14" fill="#12303a" stroke="#22d3ee" stroke-width="2"/>
    <text x="400" y="120" font-size="22" font-weight="700" fill="#e6fbff">Memoria RAM</text>
    <text x="400" y="150" font-size="16" fill="#9fdce8">masa de lucru</text>
    <text x="400" y="180" font-size="14" fill="#9fdce8">temporară, rapidă</text>

    <rect x="570" y="70" width="200" height="150" rx="14" fill="#12303a" stroke="#22d3ee" stroke-width="2"/>
    <text x="670" y="120" font-size="22" font-weight="700" fill="#e6fbff">Stocare</text>
    <text x="670" y="150" font-size="16" fill="#9fdce8">dulapul cu dosare</text>
    <text x="670" y="180" font-size="14" fill="#9fdce8">permanentă (SSD / HDD)</text>

    <line x1="232" y1="145" x2="298" y2="145" stroke="#22d3ee" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="502" y1="145" x2="568" y2="145" stroke="#22d3ee" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>

    <text x="400" y="40" font-size="18" font-weight="700" fill="#e6fbff">Cum lucrează cele trei împreună</text>
    <text x="400" y="260" font-size="15" fill="#9fdce8">Programele stau în stocare, se încarcă în RAM, iar procesorul lucrează cu ele.</text>
    <text x="400" y="282" font-size="15" fill="#9fdce8">Când oprești calculatorul, RAM se golește. Stocarea păstrează tot.</text>
  </g>
</svg>
